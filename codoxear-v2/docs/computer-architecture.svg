<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Codoxear Computer and hub architecture</title><desc id="desc">Web and future native clients communicate with a public hub. Each computer initiates an outbound authenticated connection to exactly one hub. A typed local API serves the CLI and a future desktop presenter. The computer service owns attachment and transport, while a local runtime owns agent execution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c6046"/></marker><style>text{font-family:Arial,sans-serif;fill:#302e29}.title{font-size:21px;font-weight:bold}.label{font-size:17px}.small{font-size:14px;fill:#6c6a62}.box{fill:#fffefa;stroke:#c9c3b8;stroke-width:1.5}.flow{fill:none;stroke:#9c6046;stroke-width:2;marker-end:url(#arrow)}.future{stroke-dasharray:7 5}</style></defs>
<rect width="1120" height="680" fill="#f5f2eb"/>
<text x="35" y="42" class="title">One Computer · one hub attachment · independent agent lifetimes</text>
<rect x="35" y="90" width="275" height="158" rx="12" class="box"/><text x="57" y="122" class="title">Clients</text><text x="57" y="156" class="label">Web browser — implemented</text><text x="57" y="188" class="small">HarmonyOS integration — pending</text><text x="57" y="212" class="small">iOS / Android — future clients</text>
<rect x="410" y="90" width="300" height="158" rx="12" class="box"/><text x="435" y="122" class="title">Public hub authority</text><text x="435" y="156" class="label">Identity · membership · policy</text><text x="435" y="188" class="small">Catalog + bounded request relay</text><text x="435" y="212" class="small">Current: logical hubs in one service</text>
<path d="M310 159H410" class="flow"/><text x="328" y="146" class="small">HTTPS</text>
<rect x="790" y="90" width="295" height="158" rx="12" class="box future"/><text x="815" y="122" class="title">Identity providers</text><text x="815" y="156" class="label">Feishu · WeChat · email · SMS</text><text x="815" y="188" class="small">Adapters not yet implemented</text><text x="815" y="212" class="small">Today: local password accounts</text><path d="M790 165H710" class="flow future"/>
<rect x="35" y="325" width="1050" height="320" rx="15" fill="#ece8dd" stroke="#c9c3b8"/><text x="58" y="359" class="title">Private computer</text>
<rect x="58" y="390" width="260" height="100" rx="10" class="box"/><text x="78" y="421" class="label">CLI / future desktop presenter</text><text x="78" y="451" class="small">Attach · status · doctor · detach</text><text x="78" y="474" class="small">Shared typed Computer API</text>
<rect x="408" y="390" width="300" height="100" rx="10" class="box"/><text x="433" y="421" class="label">Computer service</text><text x="433" y="451" class="small">Durable attachment · exclusive lock</text><text x="433" y="474" class="small">Reconnect · epochs · bounded RPC</text><path d="M318 440H408" class="flow"/>
<path d="M560 390V248" class="flow"/><text x="577" y="282" class="small">Computer initiates WSS</text><text x="577" y="306" class="small">Hub sends work on that connection</text>
<rect x="797" y="390" width="263" height="100" rx="10" class="box"/><text x="819" y="421" class="label">Local runtime adapter</text><text x="819" y="451" class="small">Existing v1 bridge — transitional</text><text x="819" y="474" class="small">Fixture — verified, synthetic replies</text><path d="M708 440H797" class="flow"/>
<rect x="797" y="543" width="263" height="76" rx="10" class="box future"/><text x="819" y="573" class="label">Codex · Pi · Claude Code</text><text x="819" y="598" class="small">Real execution verification pending</text><path d="M927 490V543" class="flow"/>
<text x="58" y="548" class="small">OS supervisor restarts Computer; network loss does not recreate agents.</text><text x="58" y="574" class="small">Uncertain mutations are never automatically replayed.</text><text x="58" y="600" class="small">Solid: implemented boundary. Dashed: integration still pending.</text>
<text x="58" y="622" class="small">No client-facing listener or inbound hub connection on the private computer.</text>
</svg>
