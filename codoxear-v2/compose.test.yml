services:
  verification:
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    # Runtime ceiling for verification on the 8 GiB development computer.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    shm_size: 256mb
    environment:
      CODOXEAR_VERIFICATION_SUITE: ${CODOXEAR_VERIFICATION_SUITE:-full}
    volumes:
      - ./artifacts:/work/artifacts
