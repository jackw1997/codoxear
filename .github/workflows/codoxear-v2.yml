name: Codoxear v2

on:
  pull_request:
    paths:
      - "codoxear-v2/**"
      - ".github/workflows/codoxear-v2.yml"
  push:
    branches: [main]
    paths:
      - "codoxear-v2/**"
      - ".github/workflows/codoxear-v2.yml"

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build reviewed verification image within the 2 GiB limit
        working-directory: codoxear-v2
        run: runtime/oar/build-docker.sh "$GITHUB_SHA" "codoxear-v2-ci:$GITHUB_SHA"
      - name: Verify the complete application
        working-directory: codoxear-v2
        run: node --experimental-strip-types scripts/verify-docker.ts --image "codoxear-v2-ci:$GITHUB_SHA"
      - name: Verify five independent packages and installed-package browser OAuth
        working-directory: codoxear-v2
        run: node --experimental-strip-types scripts/verify-isolation.ts --browser-image "codoxear-v2-ci:$GITHUB_SHA" "$GITHUB_SHA"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codoxear-v2-verification
          path: codoxear-v2/artifacts/
          if-no-files-found: ignore
