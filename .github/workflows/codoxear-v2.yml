name: Codoxear v2

on:
  pull_request:
    paths:
      - "codoxear-v2/**"
      - ".github/workflows/codoxear-v2.yml"
  push:
    branches: [main]
    paths:
      - "codoxear-v2/**"
      - ".github/workflows/codoxear-v2.yml"

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify the self-contained v2 application
        working-directory: codoxear-v2
        run: node --experimental-strip-types scripts/verify-docker.ts codoxear-v2-ci
      - name: Verify frontend and backend build without peer sources
        working-directory: codoxear-v2
        run: node --experimental-strip-types scripts/verify-isolation.ts "$GITHUB_SHA"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codoxear-v2-verification
          path: codoxear-v2/artifacts/
          if-no-files-found: ignore
      - name: Remove verification containers
        if: always()
        working-directory: codoxear-v2
        run: docker compose --project-name codoxear-v2-ci -f compose.test.yml down --volumes
